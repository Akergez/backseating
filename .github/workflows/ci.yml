name: CI
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        with: { extra: sway mesa-vulkan-drivers libxkbcommon-x11-dev }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.95.0 }
      - run: cargo test --workspace --locked
      - run: cargo check --workspace --locked
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        with: { extra: libxkbcommon-x11-dev }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.95.0 }
      - run: cargo build --profile dist --locked -p backseating
      - uses: actions/upload-artifact@v4
        with:
          name: backseating-linux-${{ matrix.arch }}
          path: target/dist/backseating
          retention-days: 30
  flatpak:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          dbus-uuidgen > /etc/machine-id
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - run: flatpak-builder --force-clean --user --install-deps-from=flathub .flatpak-build build-aux/app.akergez.Backseating.yml
